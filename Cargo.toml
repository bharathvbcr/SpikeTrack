[workspace]
resolver = "2"
members = ["crates/st-weights", "crates/st-model", "crates/st-eval", "crates/st-video", "crates/spiketrack", "crates/st-gate", "crates/st-coreml"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false

# Pre-existing libraries: path dependencies on the sibling ojas checkout
# (../ojas; the ojas-st worktree they once pointed at no longer exists), because
# ojas-metal reaches tessl as a sibling path (../../tessl = ~/Code/research/tessl)
# and that does not resolve from a git checkout of ojas.
[workspace.dependencies]
ojas-core = { path = "../ojas/ojas-core" }
ojas-cpu = { path = "../ojas/ojas-cpu" }
ojas-io = { path = "../ojas/ojas-io" }
ojas-metal = { path = "../ojas/ojas-metal" }
st-weights = { path = "crates/st-weights" }
st-eval = { path = "crates/st-eval" }
st-video = { path = "crates/st-video" }
