[workspace]
resolver = "2"
members = ["crates/st-weights", "crates/st-model", "crates/st-eval", "crates/st-video", "crates/spiketrack", "crates/st-gate"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.97"
publish = false

# Pre-existing libraries. metal-smoke branch: path dependencies on the ojas-st
# worktree (detached at ea3cf39, which is in ojas main), because ojas-metal
# reaches tessl as a sibling path (../../tessl = ~/Code/research/tessl) and that
# does not resolve from a git checkout of ojas.
[workspace.dependencies]
ojas-core = { path = "../ojas-st/ojas-core" }
ojas-cpu = { path = "../ojas-st/ojas-cpu" }
ojas-io = { path = "../ojas-st/ojas-io" }
ojas-metal = { path = "../ojas-st/ojas-metal" }
st-weights = { path = "crates/st-weights" }
st-eval = { path = "crates/st-eval" }
st-video = { path = "crates/st-video" }
